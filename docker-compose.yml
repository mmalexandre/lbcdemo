services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - app_net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    networks:
      - app_net
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=appdb sslmode=disable"
      SESSION_SECRET: "change-this-secret-in-production"
      FRONTEND_ORIGIN: "http://localhost:3000"
      GIN_MODE: release
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      SYSTEM_PROMPT: "${SYSTEM_PROMPT:-You are a helpful assistant.}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080"
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "3000:80"
    depends_on:
      - api

  storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    container_name: storage
    restart: unless-stopped
    networks:
      - app_net
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_SERVER_DOMAINS: storage:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  create-bucket:
    image: amazon/aws-cli:2.33.25
    container_name: mlflow-create-bucket
    networks:
      - app_net
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url=http://storage:9000 s3api head-bucket --bucket mlflow 2>/dev/null \
          && echo 'Bucket mlflow already exists.' \
          || aws --endpoint-url=http://storage:9000 s3api create-bucket --bucket mlflow --region us-east-1
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
    restart: "no"

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    restart: unless-stopped
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:postgres@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://storage:9000
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir mlflow psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "postgresql://postgres:postgres@postgres:5432/mlflow" \
          --artifacts-destination "s3://mlflow" \
          --serve-artifacts \
          --host "0.0.0.0" \
          --port "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
