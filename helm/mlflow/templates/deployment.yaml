apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: {{ .Values.namespace }}
  labels:
    app: mlflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: install-psycopg2
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pip", "install", "--target=/extra-packages", "psycopg2-binary"]
          volumeMounts:
            - name: extra-packages
              mountPath: /extra-packages
      volumes:
        - name: extra-packages
          emptyDir: {}
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PYTHONPATH
              value: /extra-packages
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port={{ .Values.service.port }}
            - --backend-store-uri=$(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination=$(MLFLOW_ARTIFACTS_DESTINATION)
            - --serve-artifacts
            - --static-prefix=/mlflow
          envFrom:
            - configMapRef:
                name: mlflow-config
          volumeMounts:
            - name: extra-packages
              mountPath: /extra-packages
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /mlflow/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /mlflow/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
