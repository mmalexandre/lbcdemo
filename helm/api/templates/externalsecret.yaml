# ClusterSecretStore — talks to AWS Secrets Manager via IRSA.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: api
            namespace: {{ .Values.namespace }}
---
# ExternalSecret — pulls lbcdemo/* keys and writes them into a Kubernetes Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}/openai-api-key
        property: value
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}/session-secret
        property: value
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}/database-url
        property: value
    - secretKey: MLFLOW_TRACKING_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}/mlflow-tracking-token
        property: value
