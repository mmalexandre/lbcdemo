# ServiceAccount with IRSA annotation so pods can assume the IAM role
# that grants access to Secrets Manager and (for MLflow) S3.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.iamRoleArn | quote }}
