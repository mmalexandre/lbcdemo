name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys to the same environment.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: lbcdemo-cluster
  NAMESPACE: lbcdemo

permissions:
  id-token: write   # Required for OIDC token exchange with AWS
  contents: read

jobs:
