name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Go API ──────────────────────────────────────────────────────────────────
  api-test:
    name: Go tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: api
          version: latest

      - name: Build Docker image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false

  # ── React frontend ───────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (validate, no upload)
        run: npm run build
